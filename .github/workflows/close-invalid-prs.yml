name: Close invalid PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  close:
    permissions:
      contents: read
      pull-requests: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/close-invalid-prs.yml@v2.9.1
    with:
      protected-branch: main
