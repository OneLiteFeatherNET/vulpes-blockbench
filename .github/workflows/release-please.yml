name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.9.1
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  # Chained into this run rather than triggered by the tag: release-please tags
  # with GITHUB_TOKEN, and a tag pushed that way starts no `on: push: tags`
  # workflow. The bundle is built from the released tag, so the asset matches
  # the version in package.json at that tag.
  bundle:
    name: Attach plugin bundle to release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the plugin bundle
        run: npm run build

      - name: Attach dist/vulpes.js to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/vulpes.js --clobber
