name: Build PR

# Type check, lint, test and bundle. There is no Node build reusable workflow in
# OneLiteFeatherNET/workflows, so this one runs the npm scripts directly.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: npm run check

      - name: Build the plugin bundle
        run: npm run build

      - name: Upload the bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vulpes-js
          path: dist/vulpes.js
          if-no-files-found: error
          retention-days: 14
